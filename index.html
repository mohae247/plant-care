<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 식물 관리</title>
<meta name="description" content="내 식물들의 물주기, 비료, 기록을 한곳에서 관리하는 앱">
<meta name="theme-color" content="#e6eee8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1713" media="(prefers-color-scheme: dark)">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="내 식물">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" crossorigin="anonymous">
<style>
/* 한 손으로 쓰는 세로 목록: 위 요약 칩, 아래 탭, 아래에서 올라오는 시트 */
:root{--bg:#e6eee8;--sf:#f8fbf8;--ink:#14261c;--mu:#5a6f62;--ac:#1f7a4d;--acs:#d3e6d9;--onac:#fff;--wa:#1f6fa8;--was:#d6e8f4;--fe:#9a6a12;--fes:#f3e5c4;--rd:#b83a28;--rds:#f6d9d2;--ln:#d2ded5;--gr:#e9eee9;--font:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;--gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--sf:#17221b;--ink:#e6efe8;--mu:#8fa497;--ac:#6fc596;--acs:#223629;--onac:#0b1a11;--wa:#7fbdf0;--was:#1b2f40;--fe:#e2b565;--fes:#38301a;--rd:#ee8a76;--rds:#3d2420;--ln:#25332a;--gr:#1d2a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--sf:#17221b;--ink:#e6efe8;--mu:#8fa497;--ac:#6fc596;--acs:#223629;--onac:#0b1a11;--wa:#7fbdf0;--was:#1b2f40;--fe:#e2b565;--fes:#38301a;--rd:#ee8a76;--rds:#3d2420;--ln:#25332a;--gr:#1d2a22;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:14px 8px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
.wrap{max-width:640px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font-size:26px;font-weight:400}
#date{color:var(--mu);font-size:13px}
.pv{margin:6px 0 0;font-size:12px;color:var(--fe);background:var(--fes);border-radius:999px;padding:3px 10px;display:inline-block}
.pv[hidden]{display:none}
#sum{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
#sum:empty{display:none}
.st{border:0;font:inherit;font-size:12px;padding:6px 11px;border-radius:999px;background:var(--acs);color:var(--ac);cursor:pointer}
.st.w{background:var(--was);color:var(--wa)}.st.f{background:var(--fes);color:var(--fe)}.st.u{background:var(--gr);color:var(--mu)}
.st.on{background:var(--ac);color:var(--onac)}.st.w.on{background:var(--wa);color:var(--onac)}.st.f.on{background:var(--fe);color:var(--onac)}.st.u.on{background:var(--mu);color:var(--bg)}
main{padding-block:4px 120px;padding-left:var(--gut-l);padding-right:var(--gut-r)}
section{background:var(--sf);border:1px solid var(--ln);border-radius:20px;margin:14px 0;overflow:hidden}
section h2{display:flex;align-items:center;gap:8px;margin:0;padding:14px 16px 10px;font-size:20px;font-weight:400;color:var(--ac)}
section h2 i{font-style:normal;font-size:12px;background:var(--acs);border-radius:999px;padding:1px 9px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--ln);cursor:pointer}
.nm{min-width:0}.nm b{font-weight:400;font-size:16px;display:block}.nm small{color:var(--mu);font-size:12px;display:block}
.act{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.b{border:0;border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer;background:var(--acs);color:var(--ac)}
.b.w{background:var(--was);color:var(--wa)}.b.f{background:var(--fes);color:var(--fe)}
.b.big{width:100%;padding:12px;font-size:15px;border-radius:14px}
.b.sv{background:var(--ac);color:var(--onac)}.b.dl{background:var(--rds);color:var(--rd)}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--acs);color:var(--ac);white-space:nowrap}
.pill.od{background:var(--rds);color:var(--rd)}.pill.td{background:var(--was);color:var(--wa)}.pill.sn{background:var(--fes);color:var(--fe)}.pill.un{background:var(--gr);color:var(--mu)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chips+.chips{margin-top:2px}
.ch{flex-shrink:0;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.ch.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.ch.sm{padding:5px 10px;font-size:12px;color:var(--mu)}.ch.sm.on{color:var(--onac)}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:4px}
textarea{resize:vertical;line-height:1.5}
#q{background:var(--sf);margin:8px 0 6px}
label{display:block;font-size:12px;color:var(--mu);margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g2>*{min-width:0}
.empty{text-align:center;color:var(--mu);padding:56px 12px;line-height:2}
.empty .b{margin-top:10px}
.flat>:first-child{border-top:0}
.l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.l1 b{font-weight:400;font-size:16px}
.tg{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--acs);color:var(--ac);white-space:nowrap}
.tg.gone{background:var(--gr);color:var(--mu)}.tg.given{background:var(--was);color:var(--wa)}.tg.check{background:var(--fes);color:var(--fe)}
.uh{margin:26px 4px 8px;font-size:17px;font-weight:400}
.dh{padding:7px 16px;font-size:12px;color:var(--mu);background:var(--bg);border-top:1px solid var(--ln)}
.ok{text-align:center;background:var(--sf);border:1px solid var(--ln);border-radius:20px;margin:14px 0;padding:30px 16px}
.ok span{display:block;font-size:40px;line-height:1.2}.ok b{display:block;font-weight:400;font-size:17px;color:var(--ac);margin-top:6px}.ok small{color:var(--mu);font-size:13px;display:block;margin-top:6px;line-height:1.6}
.ok .stack{display:grid;gap:8px;margin:20px auto 0;max-width:320px}
.mc{display:flex;justify-content:space-between;align-items:center;width:100%;margin:22px 0 0;padding:16px;border:1px dashed var(--ln);border-radius:20px;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left}
.mc b{font-weight:400;font-size:16px}.mc small{color:var(--mu);font-size:12px;display:block}
.vh{display:flex;align-items:baseline;gap:10px;margin:8px 4px 0;flex-wrap:wrap}
.vh h2{margin:0;font-size:22px;font-weight:400}
.vh p{margin:0;color:var(--mu);font-size:13px}
.back{border:0;background:none;color:var(--ac);font:inherit;font-size:14px;padding:4px 0;cursor:pointer}
.set{padding:4px 16px 16px}
.set h3{margin:14px 0 4px;font-size:17px;font-weight:400;color:var(--ac)}
.set p{margin:6px 0;font-size:14px}
.set .stack{display:grid;gap:8px;margin-top:12px}
.mu{color:var(--mu)}
.ver{margin:18px 0 4px;text-align:center;font-size:12px;color:var(--mu)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:6px;justify-content:center;background:var(--sf);border-top:1px solid var(--ln);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));padding-left:var(--gut-l);padding-right:var(--gut-r)}
.nav button{flex:1;max-width:160px;border:0;border-radius:14px;background:none;color:var(--mu);font:inherit;font-size:14px;padding:10px 0;cursor:pointer}
.nav .on{background:var(--acs);color:var(--ac)}.nav .add{background:var(--ac);color:var(--onac)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30}
#sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--sf);border-radius:22px 22px 0 0;padding-block:16px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-height:92%;overflow-y:auto;overscroll-behavior:contain}
.shh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.shh h3{margin:0;font-size:21px;font-weight:400;text-wrap:balance}
.x{border:0;background:var(--gr);color:var(--mu);border-radius:999px;width:34px;height:34px;font-size:20px;line-height:1;cursor:pointer;flex-shrink:0}
.sci{margin:2px 0 0;color:var(--mu);font-size:13px;font-style:italic}
.qa{margin-top:12px}
.grp{border:1px solid var(--ln);border-radius:16px;padding:4px 14px 14px;margin:14px 0 0}
.grp>legend,.grp>summary{font-size:14px;color:var(--ac);padding:8px 2px 2px}
.grp>summary{cursor:pointer;list-style-position:inside}
.grp>summary i{font-style:normal;font-size:11px;color:var(--mu);background:var(--gr);border-radius:999px;padding:1px 7px;margin-left:4px}
fieldset.grp{padding-top:0}
.hint{margin:8px 0 0;font-size:13px;color:var(--mu);background:var(--gr);border-radius:10px;padding:8px 10px}
.logadd{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-top:8px}
.logadd textarea{margin:0}
.logs{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
.logs li{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:start;font-size:14px}
.logs time{color:var(--mu);font-size:12px;padding-top:2px;font-variant-numeric:tabular-nums}
.logs p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.lx{border:0;background:none;color:var(--mu);font:inherit;font-size:12px;cursor:pointer;padding:2px 0}
.lx.arm{color:var(--rd)}
.note p{margin:8px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stack{display:grid;gap:8px;margin-top:16px}
.cf{margin:10px 0 0;font-size:14px}
pre.raw{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border-radius:12px;padding:10px;max-height:240px;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:13px;z-index:40;transition:.2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:none;color:var(--acs);font:inherit;font-size:13px;margin-left:8px;cursor:pointer;text-decoration:underline}
.hr{display:flex;align-items:center;gap:8px;min-width:0}
.sy{border:0;font:inherit;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--gr);color:var(--mu);cursor:pointer;white-space:nowrap}
.sy.err{background:var(--rds);color:var(--rd)}
.er{color:var(--rd)}
.lst{margin:10px 0 0;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 14px;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.nmb{flex:1;min-width:0;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:10px 0;cursor:pointer;overflow-wrap:anywhere}
.nmb small{color:var(--mu);font-size:12px;margin-left:8px}
.nmb.st2{cursor:default}.nmb.st2 small{display:block;margin:2px 0 0}
.mv{flex-shrink:0;border:0;background:var(--gr);color:var(--mu);border-radius:10px;width:38px;height:38px;font-size:13px;cursor:pointer}
.mv:disabled{opacity:.3;cursor:default}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.rn{display:grid;grid-template-columns:auto 1fr 68px auto;gap:6px 8px;align-items:center;margin-top:4px}
.rn select,.rn input{margin:0}
.rn span{font-size:13px;color:var(--mu)}
.steps{margin:14px 0 0;padding-left:22px;display:grid;gap:12px;font-size:14px}
.steps b{font-weight:400;color:var(--ac);display:block}
.steps span{display:block;color:var(--ink);line-height:1.55}
.steps .b{margin-top:8px}
textarea.code{font:13px/1.5 ui-monospace,Menlo,monospace;word-break:break-all}
.b:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:380px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap"><div class="hd"><h1>내 식물 🪴</h1><div class="hr"><span id="date"></span><button id="sy" class="sy" data-tab="settings" hidden></button></div></div><p id="pv" class="pv" hidden>Claude 미리보기예요. 여기서 바꾼 내용은 폰 앱에 저장되지 않아요</p><div id="sum"></div></div></header>
<main><div class="wrap" id="main"></div></main>
<nav class="nav"><button data-tab="all">🪴 식물</button><button data-tab="today">🌿 오늘</button><button class="add" data-new>＋ 추가</button><button data-tab="settings">⚙️ 설정</button></nav>
<div id="ov" hidden><div id="sh" role="dialog" aria-modal="true" aria-label="식물 정보"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept=".json,application/json,text/plain" hidden>
<script>
(()=>{
const APP_VER='2026.11.04';
const LOCS0=['내방','거실','안방','베란다'],LI={'내방':'🛏️','거실':'🛋️','안방':'🌙','베란다':'☀️','회사':'🏢'};
const CATS0=['코덱스','구근','선인장','다육','난초','틸란드시아','분재'],GROWTH=['동형','하형','봄·가을','사계절'],ROUTES=['구매','선물','나눔','서비스'];
const STATUS={alive:'키우는 중',gone:'떠남',given:'보냄',check:'확인 필요'};
const ICONS=['🛏️','🛋️','🌙','☀️','🏢','🪟','🍳','🛁','🌳','🪴','📍'];
const SEASONS=[['봄','🌸'],['여름','☀️'],['가을','🍁'],['겨울','❄️']];
const $=s=>document.querySelector(s),LKEY='plants-v2',SKEY='plants-sync',PKEY='plants-sync-key',DAY=864e5;
const dt=s=>new Date(s+'T00:00:00');
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
/* 파일 이름용: 2026-11-04-013305 (날짜-시분초) */
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${today()}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`};
const addD=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((dt(a)-dt(b))/DAY);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Claude 미리보기 안에서만 window.claude가 있어요. 폰 앱에서는 없어요 */
const inClaude=()=>{try{return !!(window.claude&&window.claude.use)}catch(e){return false}};
const use=n=>{try{return inClaude()?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
const ACQ0={date:'',place:'',price:'',route:'구매',note:''};
const norm=p=>{p=p||{};return Object.assign({id:uid(),name:'',sci:'',alias:'',cat:'',growth:'',origin:'',loc:'내방',status:'alive',left:null,group:'',pot:'',soil:'',fert:'',w:null,lw:null,wStart:null,wn:'',f:null,lf:null,fStart:null,tips:'',logs:[]},p,{acq:Object.assign({},ACQ0,p.acq||{}),logs:Array.isArray(p.logs)?p.logs:[]})};
/* 설정: 위치·종류·계절은 여기 있고, 드라이브로 다른 기기와 같이 맞춰요. lastBackup만 이 기기 것이에요 */
const S0=()=>({locs:[...LOCS0],cats:[...CATS0],icons:{},seasons:[3,6,9,12],rainy:{from:[6,20],to:[7,31]},snapKeep:7,lastBackup:null});

/* ---------- 상태 ---------- */
let P=[],N={},S=S0(),D={};
let mode='loading',PVD=false,DL=null,persisted=null,bip=null;
/* 미리보기인지: Claude 안이거나, 미리보기용 데이터로 열렸을 때 */
const pv=()=>PVD||inClaude();
let tab='all',st='',flt='전체',cf='',q='',undo=null,tt,sel='',eid=null,armed=null,pending=null,sheetOpen=false,skipPop=0;

/* ---------- 이 기기 저장 ---------- */
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LKEY)||'null');if(o&&Array.isArray(o.plants)){P=o.plants.map(norm);N=o.notes||{};S=Object.assign(S0(),o.settings||{});D=o.deleted||{};if(P.length)S.started=true;return true}}catch(e){}return false}
let saveErr=false;
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({plants:P,notes:N,settings:S,deleted:D}));saveErr=false;return true}catch(e){if(!saveErr){saveErr=true;toast('저장하지 못했어요. 설정에서 전체 백업을 받아 두세요.')}return false}}
/* 모든 저장은 여기를 지나요. 이 기기에 저장하고, 드라이브가 연결돼 있으면 잠시 뒤 드라이브에도 저장해요 */
function commit(){const ok=saveLocal();if(linked()){chg++;SY.dirty=true;saveSync();setSync('wait');schedule(2500)}return ok}

/* ---------- 구글 드라이브 동기화 ----------
   내 구글 계정에 만든 Apps Script 웹 앱을 거쳐 드라이브의 '내 식물 관리/my-plants.json'을 읽고 써요.
   식물마다 마지막으로 고친 시각(updated)을 비교해서, 더 최근에 고친 쪽을 남겨요. */
let SY={},syS='',chg=0,syncBusy=false,syncAgain=false,syncTimer=null,remoteDirty=false;
function loadSync(){try{const o=JSON.parse(localStorage.getItem(SKEY)||'null');if(o&&typeof o==='object')return o}catch(e){}return {}}
function saveSync(){try{localStorage.setItem(SKEY,JSON.stringify(SY))}catch(e){}}
const linked=()=>!pv()&&!!(SY.url&&SY.key);
const fail=c=>{const e=new Error(c);e.code=c;return e};
const b64e=s=>btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return atob(s)};
const okUrl=u=>/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+\/|macros\/)s\/[\w-]+\/exec$/.test(u||'');
function pendingKey(){let k='';try{k=localStorage.getItem(PKEY)||''}catch(e){}if(!k){const a=new Uint8Array(18);crypto.getRandomValues(a);k=b64e(String.fromCharCode(...a));try{localStorage.setItem(PKEY,k)}catch(e){}}return k}

function revOf(f) {
  if (!f) return '';
  var n = Number(props.getProperty('n') || 0);
  var t = String(f.getLastUpdated().getTime());
  if (!n || t !== props.getProperty('t')) {
    n++;
    props.setProperties({ n: String(n), t: t });
  }
  return String(n);
}

function mainFile() {
  var id = props.getProperty('id');
  if (id) {
    try { var f = DriveApp.getFileById(id); if (!f.isTrashed()) return f; } catch (e) {}
  }
  var it = folder().getFilesByName(FILE);
  while (it.hasNext()) {
    var g = it.next();
    if (!g.isTrashed()) { props.setProperty('id', g.getId()); return g; }
  }
  return null;
}

function folder() {

function snapFolder() {
  return byId('sid', function () { return child(folder(), SNAPS); });
}

function byId(key, make) {
  var id = props.getProperty(key);
  if (id) {
    try { var x = DriveApp.getFolderById(id); if (!x.isTrashed()) return x; } catch (e) {}
  }
  var y = make();
  props.setProperty(key, y.getId());
  return y;
}

function child(parent, name) {
  var it = parent.getFoldersByName(name);

  return parent.createFolder(name);

function snapshot(f, keep, why) {

function prune(s, keep) {
  keep = Math.max(3, Math.min(60, Number(keep) || 7));
  var daily = 0, before = 0;
  listOf(s).forEach(function (x) {
    var pre = x.name.indexOf('전.json') > 0;
    var over = pre ? (++before > 5) : (++daily > keep);

function listOf(s) {
  var it = s.getFiles(), a = [];

    var x = it.next();
    if (!x.isTrashed()) a.push({ id: x.getId(), name: x.getName(), t: x.getDateCreated().getTime(), size: x.getSize() });

function inFolder(x, s) {
  var it = x.getParents();
  while (it.hasNext()) { if (it.next().getId() === s.getId()) return true; }
  return false;
}

const rows=P.map(p=>[p.name,p.sci,p.alias,p.cat,p.growth,p.origin,p.loc,STATUS[p.status],p.left&&p.left.d,p.left&&p.left.note,p.acq.date,p.acq.route,p.acq.place,p.acq.price,p.acq.note,p.pot,p.soil,p.fert,p.w,p.lw,p.f,p.lf,p.wn,p.tips,p.logs.map(l=>(fmtD(l.d)?fmtD(l.d)+' ':'')+l.t).join('\n')]);

async function saveFile(filename,data,mime,isBackup){
if(pv()){
/* Claude 미리보기: Claude가 저장 확인 창을 띄워요 */
const dl=DL||await use('downloads');
if(!dl){openSheet(`<div class="shh"><h3>파일로 받을 수 없는 화면이에요</h3><button class="x" data-do="close" aria-label="닫기">×</button></div><p class="cf">지금은 아래 내용을 복사해 두세요.</p><pre class="raw">${esc(data.slice(0,20000))}${data.length>20000?'\n…':''}</pre><div class="btns"><button class="b big sv" data-do="copy">복사</button><button class="b big" data-do="close">닫기</button></div>`);pending={copy:data};return}
try{await dl.save({filename,data});saved(isBackup);toast('파일을 저장했어요')}
catch(e){const c=e&&e.code;toast(c==='declined'?'저장을 취소했어요':c==='rate_limited'?'잠시 후 다시 눌러 주세요':'이 화면에서는 파일을 받을 수 없어요')}
return}
/* 폰 앱: 다운로드 폴더에 저장하거나, 되는 파일이면 공유 */
const blob=new Blob([data],{type:mime});let file=null,share=false;
try{file=new File([blob],filename,{type:mime});share=!!(navigator.canShare&&navigator.canShare({files:[file]}))}catch(e){}
openSheet(`<div class="shh"><h3>${isBackup?'전체 백업':'엑셀용 목록'}</h3><button class="x" data-do="close" aria-label="닫기">×</button></div>
<p class="cf">${esc(filename)}<br><span class="mu">${Math.max(1,Math.round(blob.size/1024))}KB</span></p>
<div class="stack"><button class="b big sv" data-do="file-dl">기기에 저장 (다운로드 폴더)</button>${share?'<button class="b big" data-do="file-share">공유 (드라이브, 카톡 등)</button>':''}</div>
${isBackup?`<p class="hint">${linked()?'드라이브에는 자동으로 저장되고 있어요. 이 파일은 따로 보관하거나 다른 앱으로 옮길 때 쓰세요.':'드라이브에 자동으로 저장하려면 설정에서 구글 드라이브를 연결하세요.'}</p>`:''}`);
pending={file:{filename,blob,file,isBackup}};
}
function fileDownload(){
const f=pending&&pending.file;if(!f)return;
const url=URL.createObjectURL(f.blob),a=document.createElement('a');
a.href=url;a.download=f.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
saved(f.isBackup);closeSheet();toast('저장을 시작했어요. 다운로드 폴더를 확인하세요');
}
async function fileShare(){
const f=pending&&pending.file;if(!f||!f.file)return;
try{await navigator.share({files:[f.file],title:f.filename});saved(f.isBackup);closeSheet();toast('공유했어요')}
catch(e){toast(e&&e.name==='AbortError'?'공유를 취소했어요':'공유하지 못했어요. 기기에 저장을 눌러 주세요')}
}
function readImport(file){
const r=new FileReader();
r.onload=()=>{let o;try{o=JSON.parse(String(r.result).replace(/^﻿/,''))}catch(e){toast('JSON 백업 파일이 아니에요');return}
const d=fromBackup(o);
if(!d){toast('이 파일에서 식물 목록을 찾지 못했어요');return}
confirmImport(d,'import');
};
r.onerror=()=>toast('파일을 읽지 못했어요');
r.readAsText(file);
}

const na=d.plants.filter(p=>p.status==='alive').length,rs=why==='restore';

function applyImport(){
const d=pending;if(!d||!d.plants)return;
const keep=new Set(d.plants.map(p=>p.id)),now=Date.now(),removed=P.filter(p=>!keep.has(p.id)).map(p=>p.id);
loadData(d);removed.forEach(id=>{D[id]=now});
/* 가져온 내용이 가장 최근 것이 되도록 시각을 새로 찍어요. 그래야 다른 기기와 맞출 때 이 내용이 남아요 */
P.forEach(p=>{p.updated=now;p.restored=now});
S.started=true;S.updated=now;

commit();askPersist();
const wasTab=tab!=='all';
$('#ov').hidden=true;pending=null;eid=null;remoteDirty=false;
if(sheetOpen){sheetOpen=false;if(!pv())try{if(history.state&&history.state.nav==='sheet'){skipPop++;history.go(wasTab?-2:-1)}}catch(e){}}

}

function snapLabel(x){
const m=/my-plants-(\d{4})-(\d\d)-(\d\d)(?:-(\d\d)(\d\d)\d\d-(.+))?\.json$/.exec(x.name||'');
if(!m)return x.name;

}

$('#sh').innerHTML=`<div class="shh"><h3>자동 사본</h3><button class="x" data-do="close" aria-label="닫기">×</button></div><p class="cf">'시작 시점'은 그날 처음 바뀌기 전 상태예요. 되돌려도 바꾸기 전 상태를 사본으로 하나 더 남겨요.</p>`+
(a.length?`<div class="lst">${a.map(x=>`<div class="li"><div class="nmb st2">${esc(snapLabel(x))}<small>${kb(x.size)}</small></div><button class="b" data-do="dr-pick" data-id="${esc(x.id)}" data-n="${esc(snapLabel(x))}">되돌리기</button></div>`).join('')}</div>`:'<p class="hint">아직 사본이 없어요. 내일부터 바뀐 날마다 하나씩 생겨요.</p>');
}catch(e){if(sheetOpen)$('#sh').innerHTML=`<div class="shh"><h3>자동 사본</h3><button class="x" data-do="close" aria-label="닫기">×</button></div><p class="hint">${esc(errText(e.code))}</p>`}
}
async function pickSnap(id,label){
toast('사본을 불러오는 중이에요');
try{const r=await call({a:'snap',id});if(!r.ok)throw fail(r.err||'server');const d=fromBackup(r.data);if(!d)throw fail('server');confirmImport(d,'restore',label)}
catch(e){toast(errText(e.code))}
}
/* 연결 링크(#connect=…)로 열었을 때 */
function checkHash(){
if(pv()||!(location.hash||'').startsWith('#connect='))return;
const c=parseConn(location.hash);
try{history.replaceState(history.state,'',location.pathname+location.search)}catch(e){}
if(!c){toast('연결 링크가 올바르지 않아요');return}
if(linked()&&SY.url===c.url&&SY.key===c.key){toast('이미 연결되어 있어요');return}
openSheet(`<div class="shh"><h3>구글 드라이브 연결</h3><button class="x" data-do="close" aria-label="닫기">×</button></div><p class="cf">이 기기를 구글 드라이브에 연결할까요? 이 기기의 기록과 드라이브의 기록을 합쳐요.</p><p id="dr-msg" class="hint" hidden></p><div class="btns"><button class="b big sv" data-do="dr-link">연결</button><button class="b big" data-do="close">닫기</button></div>`);
pending={conn:c};
}

/* ---------- 위치·종류 고치기 ---------- */
function listSheet(k,val){
const isNew=val==null,word=k==='loc'?'위치':'종류',used=isNew?0:P.filter(p=>p[k]===val).length;
openSheet(`<div class="shh"><h3>${isNew?`새 ${word}`:esc(val)}</h3><button class="x" data-do="close" aria-label="닫기">×</button></div>
<label for="li-n">이름</label><input id="li-n" value="${esc(val||'')}" autocomplete="off">
${k==='loc'?`<label>아이콘</label><div class="chips wrap" id="li-ic">${ICONS.map(i=>`<button class="ch${i===ico(val||'')?' on':''}" data-ic="${i}">${i}</button>`).join('')}</div>`:''}
${used?`<p class="hint">이 ${word}의 식물 ${used}개도 함께 바뀌어요.</p>`:''}
<div class="btns"><button class="b big sv" data-do="li-save">저장</button>${isNew?'<button class="b big" data-do="close">닫기</button>':'<button class="b big dl" data-do="li-del">삭제</button>'}</div>`);
pending={list:{k,v:isNew?null:val,icon:k==='loc'?ico(val||''):''}};
}
function saveList(){
const L=pending&&pending.list;if(!L)return;
const n=v('li-n').replace(/\s+/g,' '),word=L.k==='loc'?'위치':'종류';
if(!n){$('#li-n').focus();toast('이름을 적어 주세요');return}
const a=L.k==='loc'?S.locs:S.cats,all=L.k==='loc'?locs():cats();
if(n!==L.v&&all.includes(n)){toast(`이미 있는 ${word}예요`);return}
if(L.v==null)a.push(n);
else if(n!==L.v){
const i=a.indexOf(L.v);if(i>=0)a[i]=n;else a.push(n);
const now=Date.now();P.forEach(p=>{if(p[L.k]===L.v){p[L.k]=n;p.updated=now}});
if(L.k==='loc'){if(flt===L.v)flt=n;if(S.icons[L.v]){S.icons[n]=S.icons[L.v];delete S.icons[L.v]}}else if(cf===L.v)cf=n;
}
if(L.k==='loc'){S.icons=Object.assign({},S.icons);if(L.icon&&L.icon!==(LI[n]||'📍'))S.icons[n]=L.icon;else delete S.icons[n]}
putSettings();closeSheet();render();toast('저장했어요');
}
function delList(btn){
const L=pending&&pending.list;if(!L||L.v==null)return;
const word=L.k==='loc'?'위치':'종류',ua=alive().filter(p=>p[L.k]===L.v).length;
if(ua){toast(`이 ${word}에 키우는 식물이 ${ua}개 있어요. 식물의 ${word}를 먼저 바꿔 주세요`);return}
const a=L.k==='loc'?S.locs:S.cats;
if(L.k==='loc'&&a.filter(x=>x!==L.v).length<1){toast('위치는 하나 이상 있어야 해요');return}
if(armed!==btn){armed=btn;btn.textContent='정말 지울까요?';return}
const i=a.indexOf(L.v);if(i>=0)a.splice(i,1);
if(L.k==='loc'){delete S.icons[L.v];if(flt===L.v)flt='전체'}else if(cf===L.v)cf='';
putSettings();closeSheet();render();toast('지웠어요');
}
function moveList(k,val,d){
const a=k==='loc'?S.locs:S.cats;
(k==='loc'?locs():cats()).forEach(x=>{if(!a.includes(x))a.push(x)});
const i=a.indexOf(val),j=i+d;if(i<0||j<0||j>=a.length)return;
[a[i],a[j]]=[a[j],a[i]];putSettings();render();
}
function saveSeason(){
const s=[0,1,2,3].map(i=>+$('#se'+i).value),o=s.map(x=>(x-s[0]+12)%12);
if(!(o[1]>0&&o[2]>o[1]&&o[3]>o[2])){toast('봄, 여름, 가을, 겨울 순서가 되게 골라 주세요');render();return}
const cl=(m,d)=>Math.max(1,Math.min(new Date(2024,m,0).getDate(),Math.round(d)||1));
const fm=+$('#rf-m').value,tm=+$('#rt-m').value;
S.seasons=s;S.rainy={from:[fm,cl(fm,+$('#rf-d').value)],to:[tm,cl(tm,+$('#rt-d').value)]};
putSettings();render();toast('계절 설정을 저장했어요');
}
function install(){if(!bip)return;const e=bip;bip=null;e.prompt();e.userChoice.then(()=>render()).catch(()=>render())}

/* ---------- 입력 ---------- */
document.addEventListener('click',e=>{
const t=e.target;let b=t.closest('[data-do]');
if(b){
const a=b.dataset.do;
if(a==='w'||a==='f')care(b.dataset.id,a);
else if(a==='w2'||a==='f2'){const id=eid;closeSheet();care(id,a[0])}
else if(a==='undo'){if(undo){const p=P.find(x=>x.id===undo.id);if(p){p[undo.key]=undo.prev;putPlant(p);refresh()}undo=null}$('#toast').classList.remove('show')}
else if(a==='save')saveSheet();
else if(a==='log')addLog();
else if(a==='logdel'){const p=P.find(x=>x.id===eid),i=+b.dataset.i;if(armed!==b){if(armed)armed.classList.remove('arm'),armed.textContent='지우기';armed=b;b.classList.add('arm');b.textContent='정말 지울까요?';return}if(p){p.logs.splice(i,1);putPlant(p);$('#logs').innerHTML=logsHtml(p);$('#lc-n').textContent=p.logs.length}armed=null}
else if(a==='del'){if(armed!==b){armed=b;b.textContent='정말 삭제할까요?';return}const id=eid;P=P.filter(x=>x.id!==id);delPlant(id);closeSheet();render();toast('삭제했어요')}
else if(a==='close')closeSheet();
else if(a==='go-u'){st='u';setTab('all')}
else if(a==='start'){S.started=true;putSettings();render()}
else if(a==='install')install();
else if(a==='bk-json')saveFile(`my-plants-backup-${stamp()}.json`,JSON.stringify(backupData(),null,1),'application/json',true);
else if(a==='bk-csv')saveFile(`my-plants-list-${stamp()}.csv`,csv(),'text/csv',false);
else if(a==='file-dl')fileDownload();
else if(a==='file-share')fileShare();
else if(a==='bk-imp'){$('#imp').value='';$('#imp').click()}
else if(a==='imp-ok')applyImport();
else if(a==='dr-setup')setupSheet();
else if(a==='dr-code')codeSheet();
else if(a==='dr-copy')copyText(gsCode(pendingKey()),'코드를 복사했어요. Apps Script에 붙여 넣으세요',()=>{const d=$('#dr-src');if(d)d.open=true});
else if(a==='dr-go')goConnect();
else if(a==='dr-link'){const c=pending&&pending.conn;if(c)connect(c)}
else if(a==='dr-now'){if(syncBusy)toast('지금 맞추는 중이에요');else sync()}
else if(a==='dr-share')shareSheet();
else if(a==='dr-cc')copyText(connCode(),'연결 코드를 복사했어요');
else if(a==='dr-cl')copyText(connLink(),'연결 링크를 복사했어요');
else if(a==='dr-off'){if(armed!==b){armed=b;b.textContent='정말 끊을까요? (드라이브 파일은 남아요)';return}armed=null;disconnect()}
else if(a==='dr-snaps')snapsSheet();
else if(a==='dr-pick')pickSnap(b.dataset.id,b.dataset.n);
else if(a==='li-open')listSheet(b.dataset.k,b.dataset.v==null?null:b.dataset.v);
else if(a==='li-mv')moveList(b.dataset.k,b.dataset.v,+b.dataset.d);
else if(a==='li-save')saveList();
else if(a==='li-del')delList(b);
else if(a==='copy'){const d=pending&&pending.copy;if(d&&navigator.clipboard)navigator.clipboard.writeText(d).then(()=>toast('복사했어요'),()=>toast('복사하지 못했어요. 내용을 길게 눌러 복사해 주세요'))}
return}
b=t.closest('[data-ic]');if(b&&pending&&pending.list){pending.list.icon=b.dataset.ic;document.querySelectorAll('#li-ic .ch').forEach(x=>x.classList.toggle('on',x===b));return}
b=t.closest('[data-loc]');if(b){sel=b.dataset.loc;document.querySelectorAll('#lc .ch').forEach(x=>x.classList.toggle('on',x===b));return}
b=t.closest('[data-flt]');if(b){flt=b.dataset.flt;render();return}
b=t.closest('[data-cf]');if(b){cf=cf===b.dataset.cf?'':b.dataset.cf;render();return}
b=t.closest('[data-st]');if(b){st=st===b.dataset.st?'':b.dataset.st;setTab('all');return}
b=t.closest('[data-tab]');if(b){setTab(b.dataset.tab);return}
if(t.closest('[data-new]')){sheet(null);return}
b=t.closest('[data-open]');if(b){sheet(b.dataset.open);return}
if(t.id==='ov')closeSheet();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#list').innerHTML=list()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)closeSheet()});
$('#imp').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)readImport(f)});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='keep'){S.snapKeep=+t.value;putSettings();toast(`자동 사본을 최근 ${S.snapKeep}개까지 보관해요`)}else if(t.dataset&&t.dataset.season!==undefined)saveSeason()});
document.addEventListener('visibilitychange',()=>{
if(document.hidden){if(linked()&&(SY.dirty||SY.replace))sync();return}
if(!sheetOpen)refresh();
if(linked()&&(SY.dirty||SY.replace||Date.now()-(SY.last||0)>20000))sync();
});
window.addEventListener('online',()=>{if(linked())sync()});
window.addEventListener('offline',()=>{if(linked()&&!syncBusy)setSync('off')});
/* 앱을 켜 둔 채로 있으면 5분마다 다른 기기에서 바뀐 게 있는지 봐요 */
setInterval(()=>{if(linked()&&!document.hidden&&!syncBusy&&Date.now()-(SY.last||0)>300000)sync()},60000);
/* 같은 기기에서 앱과 브라우저 탭을 같이 열어 둔 경우 */
window.addEventListener('storage',e=>{if(e.key===LKEY&&!sheetOpen){loadLocal();refresh()}else if(e.key===SKEY){SY=loadSync();paintSync()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();bip=e;if(tab==='settings'||!S.started)render()});
window.addEventListener('appinstalled',()=>{bip=null;toast('홈 화면에 설치했어요');render()});

/* 오프라인에서도 열리게 해 주는 서비스 워커 (폰 앱 주소에서만) */
function regSW(){if(pv()||!('serviceWorker' in navigator)||!window.isSecureContext)return;navigator.serviceWorker.register('sw.js').catch(()=>{})}

init().then(()=>{if(document.readyState==='complete')regSW();else window.addEventListener('load',regSW)});
})();
</script>
